[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
scorer-core = { path = "crates/scorer-core" }
scorer-llm = { path = "crates/scorer-llm" }
scorer-engine = { path = "crates/scorer-engine" }
scorer-pdf = { path = "crates/scorer-pdf" }

anyhow = "1"
base64 = "0.22"
json5 = "0.4"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-std", "io-util"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
