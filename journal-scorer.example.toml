# Copy to journal-scorer.toml (git-ignored) and adjust.
# The provider is chosen here; nothing in the code is provider-specific.

[llm]
# Use a model from your OpenCode setup: addresses and keys are read from
# OpenCode's files (~/.config/opencode, ~/.local/share/opencode/auth.json).
# List choices with `journal-scorer models`.
kind = "opencode"
model = "strata/strata"
timeout_secs = 300

# Alternative: any OpenAI-compatible server, configured directly.
# [llm]
# kind = "openai_compatible"
# base_url = "http://127.0.0.1:8080/v1"
# model = "qwen3.8-flash-next-iq3_s"
# api_key_env = "LLM_API_KEY"   # name of the env var holding the key
# timeout_secs = 300
# json_mode = true
# # Server-specific request fields, passed through verbatim:
# # [llm.extra_body.chat_template_kwargs]
# # enable_thinking = false

# Offline alternative:
# [llm]
# kind = "mock"

[scorer]
batch_size = 15
temperature = 0.0
max_tokens = 16384
max_retries = 1

[rubric]
# path = "my_rubric.toml"   # default: built-in AI Journal rubric

[server]
addr = "127.0.0.1:2379"
